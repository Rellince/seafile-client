name: Build desktop client

on:
  push:
    branches: [rellince]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake intltool valac libtool autoconf automake pkg-config re2c flex \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5webengine5 qtwebengine5-dev \
            libssl-dev libcurl4-openssl-dev libsqlite3-dev libglib2.0-dev \
            libevent-dev uuid-dev libjansson-dev libarchive-dev \
            libfuse-dev libsasl2-dev libldap2-dev libonig-dev libxml2-dev libjwt-dev libhiredis-dev \
            sqlite3 file desktop-file-utils libfuse2

      - name: Build libsearpc + libseafile from source
        run: |
          # Upstream Ubuntu's libseafile-dev is ~8.x; master uses error codes added in 9+.
          # haiwen maintains seafile-test-deploy for exactly this — clones & builds matching
          # versions of libsearpc + ccnet-server + seafile-server, installs to /usr/local.
          git clone --depth=1 --branch=master https://github.com/haiwen/seafile-test-deploy /tmp/seafile-test-deploy
          cd /tmp/seafile-test-deploy
          # bootstrap.sh expects these env vars to exist; values irrelevant for client build
          export JWT_PRIVATE_KEY=ci-placeholder SITE_ROOT=/ \
                 SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet \
                 SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile \
                 SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub
          ./bootstrap.sh
          sudo ldconfig

      - name: Compute version
        id: meta
        run: |
          SHA_SHORT=${GITHUB_SHA::12}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            APK_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="rellince-${{ github.run_number }}-${SHA_SHORT}"
            APK_TAG="${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release_tag=${APK_TAG}" >> $GITHUB_OUTPUT

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release .

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package AppImage
        run: |
          DESTDIR="$(pwd)/AppDir" cmake --install build
          curl -sL -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sL -o linuxdeploy-plugin-qt "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          OUT="seafile-client-rellince-${{ steps.meta.outputs.version }}-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage --desktop-file AppDir/usr/share/applications/seafile.desktop
          mv Seafile_Client*.AppImage "${OUT}" 2>/dev/null || mv *.AppImage "${OUT}"
          echo "OUT=${OUT}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seafile-client-linux-${{ steps.meta.outputs.version }}
          path: ${{ env.OUT }}
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Seafile Client (rellince) ${{ steps.meta.outputs.version }}
          files: ${{ env.OUT }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS & Windows builds deferred until a relative actually asks for native
  # desktop on those platforms. Pattern: brew install qt5 + build libsearpc/libseafile
  # from source via vcpkg or homebrew tap, cmake build, macdeployqt / windeployqt + NSIS.
  # Both unsigned initially per the earlier fork-setup decision.
